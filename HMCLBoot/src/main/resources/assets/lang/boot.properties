boot.unsupported_java_version=ØchreCL requires Java 17 or later to run, but still supports launching games with Java 6~16. Please install the latest version of Java and try opening ØchreCL again.\nYou can keep your old version of Java. ØchreCL can detect and manage multiple Java installations, and will automatically select the appropriate Java version for your game.
