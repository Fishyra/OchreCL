name: 问题反馈
description: 报告 ØchreCL 的启动、界面、下载或服务器问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: 请勿上传账号令牌、密码、穿透认证信息或整个 data 目录。
  - type: input
    id: version
    attributes:
      label: 启动器版本
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 操作系统与处理器
      placeholder: 例如 Windows 11 x64 / macOS 15 Apple M1
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤、预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志与截图
